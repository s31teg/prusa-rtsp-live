# Same as docker-compose.yml, but builds the image from this repository on the
# Docker host instead of pulling it from ghcr.io. Use this as the compose path
# for a Portainer "Repository" stack if you don't want a registry login.

services:
  prusa-rtsp-live:
    build: .
    image: prusa-rtsp-live:local
    container_name: prusa-rtsp-live
    restart: unless-stopped
    network_mode: host
    labels:
      - autoheal=true
    environment:
      MODE: ${MODE:-webcam}
      PRUSA_TOKEN: ${PRUSA_TOKEN:?set PRUSA_TOKEN to the camera token from Prusa Connect}
      CAMERA_URL: ${CAMERA_URL:?set CAMERA_URL to the camera's rtsp:// or rtsps:// address}
      FINGERPRINT: ${FINGERPRINT:-}
      CAMERA_NAME: ${CAMERA_NAME:-RTSP Camera}
      SNAPSHOT_INTERVAL: ${SNAPSHOT_INTERVAL:-10}
      VIDEO_MAX_WIDTH: ${VIDEO_MAX_WIDTH:-1920}
      VIDEO_MAX_HEIGHT: ${VIDEO_MAX_HEIGHT:-1080}
      VIDEO_MAX_FPS: ${VIDEO_MAX_FPS:-25}
      VIDEO_MAX_BITRATE: ${VIDEO_MAX_BITRATE:-4000000}
      MAX_VIEWERS: ${MAX_VIEWERS:-2}
      X264_PRESET: ${X264_PRESET:-veryfast}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/London}
